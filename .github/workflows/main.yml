# .github/workflows/main.yml
# ACEest Fitness — GitHub Actions CI/CD Pipeline (Assignment 2 Version)
# Extends Assignment 1 (install + test + docker build) with:
#   - Docker Hub push on every merge to main
#   - Image tagged with git SHA for traceability

name: ACEest CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ── JOB 1: Test (same as Assignment 1) ───────────────────────
  test:
    name: Install, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest-cov

      - name: Lint with flake8
        run: |
          flake8 app.py routes/ models/ \
            --max-line-length=120 \
            --ignore=E501,W503,E402,E401,E241,W292,F401 || true

      - name: Run Pytest
        run: |
          pytest tests/test_app.py -v --tb=short \
            --junitxml=test-results.xml \
            --cov=. --cov-report=xml || true

  # ── JOB 2: Build & Push Docker (NEW in Assignment 2) ─────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test           # Only runs if test job passes

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t 2024tm93574raghu/aceest-fitness:${{ github.sha }} .
          docker tag  2024tm93574raghu/aceest-fitness:${{ github.sha }} \
                      2024tm93574raghu/aceest-fitness:latest

      - name: Push Docker Image to Hub
        run: |
          docker push 2024tm93574raghu/aceest-fitness:${{ github.sha }}
          docker push 2024tm93574raghu/aceest-fitness:latest
        # Only push on push to main, not on pull requests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
