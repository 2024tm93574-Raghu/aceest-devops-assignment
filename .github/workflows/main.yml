name: ACEest CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ─────────────────────────────────────────────
  # JOB 1: Lint & Syntax Check
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run flake8 lint
        run: |
          flake8 app.py routes/ models/ --max-line-length=120 --ignore=E501,W503 || true

  # ─────────────────────────────────────────────
  # JOB 2: Build Docker Image
  # ─────────────────────────────────────────────
  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t aceest-fitness:${{ github.sha }} .

      - name: Verify image exists
        run: |
          docker images aceest-fitness

  # ─────────────────────────────────────────────
  # JOB 3: Run Pytest inside Docker
  # ─────────────────────────────────────────────
  test:
    name: Automated Tests (Pytest in Docker)
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image for testing
        run: docker build -t aceest-test:latest .

      - name: Run Pytest inside container
        run: |
          docker run --rm \
            -e FLASK_ENV=testing \
            aceest-test:latest \
            python -m pytest tests/test_app.py -v --tb=short